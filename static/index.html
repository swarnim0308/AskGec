<html lang="en" >

  <link rel='stylesheet' href='https://fonts.googleapis.com/icon?family=Material+Icons'>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<!-- partial:index.partial.html -->
<div id="center-text">
    <center>
       <img src="{{ bot_im }}" class="img-circle" width="180px" height="180px" style="border-radius: 50%; object-fit: cover; border: 4px solid #5A5EB9; box-shadow: 0 4px 15px rgba(0,0,0,0.15);">
	<br><br>
       <h3 style="font-weight: 700; color: #2C3E50;"> {{ bot }} </h3>
       <br>

       <p style="font-size: 16px; color: #555;">Conversational QnA Bot</p>
       Made With <i class="fas fa-heart" style="font-size:16px;color:red;"></i> By <strong>Siddhant Sarkar, Swarnim Shukla, Sourabh Patel, And Rahul Painkra</strong> at GEC Bilaspur
       <br><br>
       <a href="https://github.com/swarnim0308/AskGec" target="_blank" style="color: #333; text-decoration: none;">
         <i class="fab fa-github" style="font-size:40px;"></i>
       </a>

     </center>
  </div> 
<div id="body"> 
  
<div id="chat-circle" class="btn btn-raised">
        <div id="chat-overlay"></div>
		    <i class="material-icons">chat_bubble_outline</i>
	</div>
  
  <div class="chat-box">
    <div class="chat-box-header">
      askGEC
      <span class="chat-box-toggle"><i class="material-icons">close</i></span>
    </div>
    <div class="chat-box-body">
      <div class="chat-box-overlay">   
      </div>
      <div class="chat-logs">
       
      </div><!--chat-log -->
    </div>
    <div class="chat-input">      
      <form>
        <input type="text" id="chat-input" placeholder="Send a message..."/>
      <button type="submit" class="chat-submit" id="chat-submit"><i class="material-icons">send</i></button>
      </form>      
    </div>
  </div>
  
  
  
  
</div>
<!-- partial -->
  <script src='https://cdnjs.cloudflare.com/ajax/libs/jquery/3.1.1/jquery.min.js'></script>
